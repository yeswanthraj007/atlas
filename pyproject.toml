[project]
name = "atlas"
version = "0.1.0"
description = "Institutional-grade portfolio, risk and trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
    "cvxpy>=1.5",
    "pyarrow>=16",
    "alpaca-py>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
    "lxml>=6.1.3",
]

[project.scripts]
atlas = "atlas.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
